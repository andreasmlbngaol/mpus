name: Release

# Tag-driven: pushing a tag like v1.0 builds a signed release and attaches the APK.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Read version from build.gradle.kts
        id: version
        run: |
          set -euo pipefail
          version_name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          version_code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$version_name versionCode=$version_code"

      - name: Check the tag matches versionName
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.name }}" ]; then
            echo "Tag v$tag does not match versionName ${{ steps.version.outputs.name }} in app/build.gradle.kts"
            echo "Bump versionName (and versionCode), then tag v<versionName>."
            exit 1
          fi

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "Missing GOOGLE_SERVICES_JSON secret (needed for the google-services plugin)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MPUS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Missing MPUS_KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mpus-release.jks"

      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://mpus.booroong.online' }}
          MPUS_KEYSTORE_FILE: ${{ runner.temp }}/mpus-release.jks
          MPUS_KEYSTORE_PASSWORD: ${{ secrets.MPUS_KEYSTORE_PASSWORD }}
          MPUS_KEY_ALIAS: ${{ secrets.MPUS_KEY_ALIAS }}
          MPUS_KEY_PASSWORD: ${{ secrets.MPUS_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Collect the APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          out="mpus-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$out"
          echo "APK: $out ($(du -h "$out" | cut -f1))"

      # R8 renames everything, so this file is the only way to read a crash stack trace.
      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: mpus ${{ steps.version.outputs.name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: mpus-${{ steps.version.outputs.name }}.apk
